name: Scrum Master Pipeline CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

jobs:
  unit-tests:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run unit tests (integration excluded)
        run: pytest tests/ -m "not integration" -v --tb=short

      - name: Coverage gate - scrum_calculator (>= 90%)
        run: pytest tests/test_scrum_calculator.py --cov=scrum_calculator --cov-fail-under=90

      - name: Coverage gate - agile_client (>= 80%)
        run: pytest tests/test_agile_client.py --cov=agile_client --cov-fail-under=80

  lint-check:
    name: Lint Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pyflakes
        run: pip install pyflakes

      - name: Run pyflakes
        run: python -m pyflakes agile_client.py scrum_calculator.py
